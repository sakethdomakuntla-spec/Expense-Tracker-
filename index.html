<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div>WELCOME!</div>
            <ul>
                <li>About Us</li>
                <li>Profile</li>
            </ul>
            <input type="button" value="Add Transaction">
        </nav>
        <main>
            <section id="Money">
                <div class="CB">
                    Current Balance
                    <div class="cbamount">
                        $ 15000.90
                    </div>
                </div>
                <div class="IE">
                    <div>
                        <div class=" logo inlogo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50px" height="50px" fill="green" class="bi bi-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0z"/>
                            </svg>
                        </div>
                        <div class="income">
                            Income
                            <div class="inamount">
                                +$1,000
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class=" logo exlogo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="red" class="bi bi-arrow-down-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M14 13.5a.5.5 0 0 1-.5.5h-6a.5.5 0 0 1 0-1h4.793L2.146 2.854a.5.5 0 1 1 .708-.708L13 12.293V7.5a.5.5 0 0 1 1 0z"/>
                            </svg>
                        </div>
                        <div class="expense">
                            Expense
                            <div class="examount">
                                -$500
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section id="transactions">
                <div class="transactions">
                    
                </div>
                <div class="optional"></div>
            </section>
        </main>
        <footer>
            <div class="logo"></div>
        </footer>
    </div>
</body>
</html>
