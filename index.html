<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div id="heading">WELCOME!</div>
            <ul>
                <li>About Us</li>
                <li>Profile</li>
            </ul>
            <input type="button" value="Add Transaction" id="Tbutton">
        </nav>
        <main>
            <section id="Money">
                <div class="CB">
                    Current Balance
                    <div class="cbamount">
                    </div>
                </div>
                <div class="IE">
                    <div>
                        <div class=" logo inlogo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50px" height="50px" fill="green" class="bi bi-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0z"/>
                            </svg>
                        </div>
                        <div class="income">
                            Income
                            <div class="inamount">
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class=" logo exlogo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="red" class="bi bi-arrow-down-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M14 13.5a.5.5 0 0 1-.5.5h-6a.5.5 0 0 1 0-1h4.793L2.146 2.854a.5.5 0 1 1 .708-.708L13 12.293V7.5a.5.5 0 0 1 1 0z"/>
                            </svg>
                        </div>
                        <div class="expense">
                            Expense
                            <div class="examount">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section id="transactions">
                <div class="transactionsblock">
                    <span>Transactions</span>
                    <div class="transactions">
                    </div>
                </div>
                <div class="BarGraph">
                    <span>Overview</span>
                    <div class="graph">
                        <img src="graphTemplate.png" alt="graph">
                        <div class="bar incomebar"></div>
                        <div class="bar expensebar"></div>
                        <div class="num" id="v1"></div>
                        <div class="num" id="v2"></div>
                        <div class="num" id="v3"></div>
                        <div class="num" id="v4"></div>
                        <div class="num" id="v5"></div>
                        <div class="num" id="v6"></div>
                        <div class="num" id="v7"></div>
                        <div class="num" id="v8"></div>
                        <div class="num" id="v9"></div>
                        <div class="num" id="v10"></div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <span>EXPENSE TRACKER</span>
            <span>I hope we have served you well</span>
        </footer>
        <script src="script.js"></script>
    </div>
</body>
</html>
